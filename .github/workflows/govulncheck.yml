name: govulncheck

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  schedule:
    # Weekly on Monday at 06:00 UTC — catches new CVEs even without code changes.
    - cron: '0 6 * * 1'

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task govulncheck
