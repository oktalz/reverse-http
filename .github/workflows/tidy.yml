name: tidy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task tidy

      - name: verify go.mod / go.sum are tidy
        run: git diff --exit-code -- go.mod go.sum
